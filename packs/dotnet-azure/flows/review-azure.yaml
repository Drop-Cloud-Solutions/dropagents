# AP-IFW-002 — retained flow: review-azure
#
# Read-only audit of Azure resources. The agent uses the Azure MCP
# server to inspect state; no mutations. Event shape matches
# review-codebase so the board's review-card renderer stays
# task_type-agnostic.
#
# AP-IFG-003 — start_mode derivation
#   v1 task type: review-azure (TYPE_PIPELINES["review-azure"])
#   v1 stages:    dev → report-only → wait-action
#                 (dev role = azure-reviewer)
#   start_mode:   auto — first stage `dev` (azure-reviewer) runs without
#                 an operator gate. The Implement/Dismiss operator gate
#                 is at the THIRD stage (`wait-action`), not the first.

on: TaskApproved
when: task.type == "review-azure"
start_mode: auto
# What this flow is as a task type (flow id == task type). The single
# source for the per-type facts the pipeline used to hardcode in five
# lists - see core/flow/task-types.ts.
task_type:
  label: "Review Azure resources"
  decomposable: true
  writes_code: false
  worktree: task
  add_task: true
  produces_report: true
steps:
  - id: review
    agent: azure-reviewer
    model: none
    params:
      pre_emit: ReviewRequested
    on_success: emit:ReviewApproved
    on_failure: emit:ReviewRejected
